apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-web
  namespace: {{.Values.namespace | default "nginx-web"}}
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  selector:
    matchLabels:
      app: nginx-web
  template:
    metadata:
      labels:
        app: nginx
    spec:
        containers:
        - name: nginx
          image: nginx:{{ .Values.nginxVersion | default "1.25-alpine" }}
          ports:
          - containerPort: 80
              name: http
          resources:
            {{ toYaml .Values.resources }}
          volumeMounts:
          - name: nginx-config
            mountPath: /etc/nginx/conf.d/default.conf
            subPath: default.conf
        volumes:
        - name: nginx-config
          configMap:
              name: nginx-config